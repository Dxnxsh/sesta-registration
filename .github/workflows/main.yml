name: Deploy to Azure VM

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (not used directly, but required for Actions)
        uses: actions/checkout@v4

      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22

          script: |
            REPO_PATH="/var/www/html"
            BRANCH="main"
            REPO_URL="https://github.com/Dxnxsh/sesta-registration.git"

            if [ -d "$REPO_PATH/.git" ]; then
              echo "Git repository exists at $REPO_PATH. Pulling latest changes..."
              cd "$REPO_PATH"
              sudo git reset --hard
              sudo git pull origin "$BRANCH"
            else
              echo "Cleaning and cloning fresh..."
              sudo rm -rf "$REPO_PATH"
              sudo git clone --branch "$BRANCH" "$REPO_URL" "$REPO_PATH"
            fi

            echo "Restarting Apache..."
            sudo systemctl restart apache2
